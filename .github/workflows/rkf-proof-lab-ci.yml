name: RKF proof-lab CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  proof-lab:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install runtime dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy

      - name: Compile Python sources
        run: python -m compileall -q proof_lab

      - name: Run proof-lab tests
        run: python -m unittest discover -v -s proof_lab -p 'test_*.py'
