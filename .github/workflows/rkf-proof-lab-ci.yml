name: RKF proof-lab CI

on:
  push:
    branches:
      - agent/bilateral-jet-flow-capstone
      - agent/madhava-smriti-jet-flow-closure
      - agent/directed-arithmetic-analytic-closure
      - agent/first-visible-jet-seam-quotient
      - agent/source-bound-numerical-validation
      - theorem-49-local-to-uniform-seam-gap
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  proof-lab:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.12']
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install runtime dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy

      - name: Compile Python sources
        run: python -m compileall -q proof_lab

      - name: Run proof-lab tests
        run: python -m unittest discover -v -s proof_lab -p 'test_*.py'

      - name: Reproduce bilateral jet-flow capstone certificate
        run: |
          python -m proof_lab.bilateral_jet_flow_capstone \
            --output proof_lab/BILATERAL_JET_FLOW_CAPSTONE_ACTUAL.json
          python - <<'PY'
          import hashlib
          from pathlib import Path

          actual = hashlib.sha256(
              Path('proof_lab/BILATERAL_JET_FLOW_CAPSTONE_ACTUAL.json').read_bytes()
          ).hexdigest()
          expected = Path(
              'proof_lab/BILATERAL_JET_FLOW_CAPSTONE_EXPECTED.sha256'
          ).read_text(encoding='utf-8').strip()
          assert actual == expected, (actual, expected)
          print('PASS_BILATERAL_JET_FLOW_CAPSTONE_HASH', actual)
          PY

      - name: Reproduce Madhava-Smriti closure certificate
        run: |
          python -m proof_lab.madhava_smriti_bilateral_jet_flow \
            --output proof_lab/MADHAVA_SMRITI_BILATERAL_JET_FLOW_ACTUAL.json
          python - <<'PY'
          import hashlib
          from pathlib import Path

          actual = hashlib.sha256(
              Path(
                  'proof_lab/MADHAVA_SMRITI_BILATERAL_JET_FLOW_ACTUAL.json'
              ).read_bytes()
          ).hexdigest()
          expected = Path(
              'proof_lab/MADHAVA_SMRITI_BILATERAL_JET_FLOW_EXPECTED.sha256'
          ).read_text(encoding='utf-8').strip()
          assert actual == expected, (actual, expected)
          print('PASS_MADHAVA_SMRITI_BILATERAL_JET_FLOW_HASH', actual)
          PY

      - name: Reproduce directed arithmetic-analytic closure certificate
        run: |
          python -m proof_lab.directed_arithmetic_analytic_closure \
            --output proof_lab/DIRECTED_ARITHMETIC_ANALYTIC_CLOSURE_ACTUAL.json
          python - <<'PY'
          import hashlib
          from pathlib import Path

          actual = hashlib.sha256(
              Path(
                  'proof_lab/DIRECTED_ARITHMETIC_ANALYTIC_CLOSURE_ACTUAL.json'
              ).read_bytes()
          ).hexdigest()
          expected = Path(
              'proof_lab/DIRECTED_ARITHMETIC_ANALYTIC_CLOSURE_EXPECTED.sha256'
          ).read_text(encoding='utf-8').strip()
          assert actual == expected, (actual, expected)
          print('PASS_DIRECTED_ARITHMETIC_ANALYTIC_CLOSURE_HASH', actual)
          PY

      - name: Reproduce first-visible-jet seam quotient certificate
        run: |
          python -m proof_lab.first_visible_jet_seam_quotient \
            --output proof_lab/FIRST_VISIBLE_JET_SEAM_QUOTIENT_ACTUAL.json
          python - <<'PY'
          import hashlib
          from pathlib import Path

          actual = hashlib.sha256(
              Path(
                  'proof_lab/FIRST_VISIBLE_JET_SEAM_QUOTIENT_ACTUAL.json'
              ).read_bytes()
          ).hexdigest()
          expected = Path(
              'proof_lab/FIRST_VISIBLE_JET_SEAM_QUOTIENT_EXPECTED.sha256'
          ).read_text(encoding='utf-8').strip()
          assert actual == expected, (actual, expected)
          print('PASS_FIRST_VISIBLE_JET_SEAM_QUOTIENT_HASH', actual)
          PY

      - name: Reproduce source-bound proof-carrying numerical certificate
        run: |
          python -m proof_lab.source_bound_numerical_validation \
            --output proof_lab/SOURCE_BOUND_PROOF_CARRYING_NUMERICAL_VALIDATION_ACTUAL.json
          python - <<'PY'
          import hashlib
          from pathlib import Path

          actual = hashlib.sha256(
              Path(
                  'proof_lab/SOURCE_BOUND_PROOF_CARRYING_NUMERICAL_VALIDATION_ACTUAL.json'
              ).read_bytes()
          ).hexdigest()
          expected = Path(
              'proof_lab/SOURCE_BOUND_PROOF_CARRYING_NUMERICAL_VALIDATION_EXPECTED.sha256'
          ).read_text(encoding='utf-8').strip()
          assert actual == expected, (actual, expected)
          print('PASS_SOURCE_BOUND_PROOF_CARRYING_NUMERICAL_VALIDATION_HASH', actual)
          PY

      - name: Reproduce EMK algebra cut-graded curvature certificate
        run: |
          python -m proof_lab.emk_algebra_cut_graded_curvature \
            --output proof_lab/EMK_ALGEBRA_CUT_GRADED_CURVATURE_ACTUAL.json
          python - <<'PY'
