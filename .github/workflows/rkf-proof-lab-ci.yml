name: RKF proof-lab CI

on:
  push:
    branches:
      - agent/bilateral-jet-flow-capstone
      - agent/madhava-smriti-jet-flow-closure
      - agent/directed-arithmetic-analytic-closure
      - agent/first-visible-jet-seam-quotient
      - agent/source-bound-numerical-validation
      - theorem-49-local-to-uniform-seam-gap
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  proof-lab:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.12']
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install runtime dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy

      - name: Compile Python sources
        run: python -m compileall -q proof_lab

      - name: Run proof-lab tests
        run: python -m unittest discover -v -s proof_lab -p 'test_*.py'

      - name: Reproduce bilateral jet-flow capstone certificate
        run: |
          python -m proof_lab.bilateral_jet_flow_capstone \
            --output proof_lab/BILATERAL_JET_FLOW_CAPSTONE_ACTUAL.json
          python - <<'PY'
          import hashlib
          from pathlib import Path

          actual = hashlib.sha256(
              Path('proof_lab/BILATERAL_JET_FLOW_CAPSTONE_ACTUAL.json').read_bytes()
          ).hexdigest()
          expected = Path(
              'proof_lab/BILATERAL_JET_FLOW_CAPSTONE_EXPECTED.sha256'
          ).read_text(encoding='utf-8').strip()
          assert actual == expected, (actual, expected)
          print('PASS_BILATERAL_JET_FLOW_CAPSTONE_HASH', actual)
          PY

      - name: Reproduce Madhava-Smriti closure certificate
