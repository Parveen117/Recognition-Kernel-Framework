          actual = hashlib.sha256(
              Path(
                  'proof_lab/MADHAVA_SMRITI_BILATERAL_JET_FLOW_ACTUAL.json'
              ).read_bytes()
          ).hexdigest()
          expected = Path(
              'proof_lab/MADHAVA_SMRITI_BILATERAL_JET_FLOW_EXPECTED.sha256'
          ).read_text(encoding='utf-8').strip()
          assert actual == expected, (actual, expected)
          print('PASS_MADHAVA_SMRITI_BILATERAL_JET_FLOW_HASH', actual)
          PY

