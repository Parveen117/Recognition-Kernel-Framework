          actual = hashlib.sha256(
              Path('proof_lab/CANVAS_OPERATORS_NATIVIZED_ACTUAL.json').read_bytes()
          ).hexdigest()
          expected = Path(
              'proof_lab/CANVAS_OPERATORS_NATIVIZED_EXPECTED.sha256'
          ).read_text(encoding='utf-8').strip()
          assert actual == expected, (actual, expected)
          print('PASS_CANVAS_OPERATORS_NATIVIZED_HASH', actual)
          PY
