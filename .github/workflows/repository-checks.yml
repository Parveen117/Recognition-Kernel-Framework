name: Repository checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  affected-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Select affected existing contracts
        id: scope
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          python - <<'PY'
          import json
          import os
          import re
          import subprocess
          from pathlib import Path

          base = os.environ.get('BASE_SHA', '')
          head = os.environ['HEAD_SHA']
          full = os.environ['EVENT_NAME'] == 'workflow_dispatch'
          # A first push has no previous commit: check every bounded contract.
          if not re.fullmatch(r'[0-9a-f]{40}', base) or set(base) == {'0'}:
              full = True
          changed = set() if full else set(subprocess.check_output(
              ['git', 'diff', '--name-only', '-z', base, head], text=True
          ).split('\0')) - {''}

          def under(prefix):
              return any(path.startswith(prefix) for path in changed)

          runtime = '.node-version' in changed
          native = 'operator_foundation/core/native_operator.cjs' in changed
          memory_manifest = 'theorum/morphic_recognition/MEMORY_SOURCE_MANIFEST.json'
          # Follow the declared source set without importing scientific code.
          memory_inputs = set(json.loads(Path(memory_manifest).read_text())['source_sha256'])
          memory_inputs.update({
              memory_manifest,
              'theorum/morphic_recognition/MEMORY_CERTIFICATE.json',
              'proof_lab/__init__.py',
              'proof_lab/morphic_recognition/__init__.py',
          })
          structure = 'research/structure_report/'
          shared_structure = {
              structure + 'structure_report.cjs',
              structure + 'instances.cjs',
          }
          signal_inputs = {
              'operator_foundation/theory/01_NATIVE_ALGEBRA.md',
              'theorum/stratified_recognition/04_physical_observer_minimum_sensor_repair.md',
              'theorum/thermodynamics/10_thermodynamic_cut_square_response_decomposition.md',
              'theorum/thermodynamics/09_scope_exclusions.md',
          }
          sp1_inputs = set(json.loads(Path(
              'research/spanda_recognition/SOURCE_PINS.json'
          ).read_text())['sha256'])
          pg1_inputs = set(json.loads(Path(
              'research/panini_grammar/SOURCE_PINS.json'
          ).read_text())['local_source_sha256'])
          scopes = {
              'engine': runtime or any(
                  path.startswith('operator_foundation/')
                  and not path.startswith('operator_foundation/sources/')
                  for path in changed
              ),
              'memory': bool(changed & memory_inputs),
              'r3': runtime or native or any(
                  path.startswith(structure) and not path.startswith(structure + 'r4/')
                  for path in changed
              ),
              'r4': runtime or native or under(structure + 'r4/')
                    or bool(changed & shared_structure),
              'ss1': runtime or native or under('research/sectoral_signal/')
                     or bool(changed & signal_inputs),
              'sp1': under('research/spanda_recognition/')
                     or bool(changed & sp1_inputs)
                     or '.github/workflows/repository-checks.yml' in changed,
              'pg1': under('research/panini_grammar/')
                     or bool(changed & pg1_inputs)
                     or '.github/workflows/repository-checks.yml' in changed,
              'shaiva': bool(changed & {
                  'proof_lab/shaiva_sources_nativized.py',
                  'proof_lab/test_shaiva_sources_nativized.py',
                  'proof_lab/SHAIVA_SOURCES_NATIVIZED_EXPECTED.sha256',
                  'theorum/78_shaiva_sources_maheshvara_spanda_pratyabhijna_theorem.md',
                  'proof_lab/shaiva_sources_varga_crystal.py',
                  'proof_lab/test_shaiva_sources_varga_crystal.py',
                  'proof_lab/SHAIVA_SOURCES_VARGA_CRYSTAL_EXPECTED.sha256',
                  'theorum/79_shaiva_sources_varga_grid_crystal_theorem.md',
                  'proof_lab/paninian_instruction_format.py',
                  'proof_lab/test_paninian_instruction_format.py',
                  'proof_lab/PANINIAN_INSTRUCTION_FORMAT_EXPECTED.sha256',
                  'theorum/80_paninian_instruction_format_theorem.md',
                  'proof_lab/paninian_samjna_sound_layer.py',
                  'proof_lab/test_paninian_samjna_sound_layer.py',
                  'proof_lab/PANINIAN_SAMJNA_SOUND_LAYER_EXPECTED.sha256',
                  'theorum/81_paninian_samjna_sound_layer_theorem.md',
                  'proof_lab/astadhyayi_ledger.py',
                  'proof_lab/test_astadhyayi_ledger.py',
                  'proof_lab/astadhyayi/ASTADHYAYI_LEDGER.json',
                  'proof_lab/astadhyayi/ASTADHYAYI_LEDGER.md',
                  'research/panini_grammar/SUTRAPATHA.tsv',
                  'proof_lab/paninian_it_samjna_compiled.py',
                  'proof_lab/test_paninian_it_samjna_compiled.py',
                  'proof_lab/PANINIAN_IT_SAMJNA_COMPILED_EXPECTED.sha256',
                  'theorum/82_paninian_it_samjna_compiled_theorem.md',
                  'proof_lab/paniniya_siksha_sources.py',
                  'proof_lab/test_paniniya_siksha_sources.py',
                  'proof_lab/PANINIYA_SIKSHA_SOURCES_EXPECTED.sha256',
                  'theorum/83_paniniya_siksha_sources_theorem.md',
                  'proof_lab/vedanga_sources_quoted.py',
                  'proof_lab/test_vedanga_sources_quoted.py',
                  'proof_lab/VEDANGA_SOURCES_QUOTED_EXPECTED.sha256',
                  'theorum/84_vedanga_sources_quoted_theorem.md',
                  'proof_lab/nirukta_nama_akhyatajani.py',
                  'proof_lab/test_nirukta_nama_akhyatajani.py',
                  'proof_lab/NIRUKTA_NAMA_AKHYATAJANI_EXPECTED.sha256',
                  'theorum/85_nirukta_nama_akhyatajani_theorem.md',
                  'proof_lab/nirukta_dhatupatha_nama.py',
                  'proof_lab/test_nirukta_dhatupatha_nama.py',
                  'proof_lab/NIRUKTA_DHATUPATHA_NAMA_EXPECTED.sha256',
                  'theorum/86_nirukta_dhatupatha_nama_theorem.md',
                  'proof_lab/tripadi_nishtha_compiled.py',
                  'proof_lab/test_tripadi_nishtha_compiled.py',
                  'proof_lab/TRIPADI_NISHTHA_COMPILED_EXPECTED.sha256',
                  'theorum/87_tripadi_nishtha_compiled_theorem.md',
                  'proof_lab/ap_stem_sup_compiled.py',
                  'proof_lab/test_ap_stem_sup_compiled.py',
                  'proof_lab/AP_STEM_SUP_COMPILED_EXPECTED.sha256',
                  'theorum/88_ap_stem_sup_compiled_theorem.md',
                  'proof_lab/ngi_stem_sup_compiled.py',
                  'proof_lab/test_ngi_stem_sup_compiled.py',
                  'proof_lab/NGI_STEM_SUP_COMPILED_EXPECTED.sha256',
                  'theorum/89_ngi_stem_sup_compiled_theorem.md',
                  'proof_lab/r_stem_sup_compiled.py',
                  'proof_lab/test_r_stem_sup_compiled.py',
                  'proof_lab/R_STEM_SUP_COMPILED_EXPECTED.sha256',
                  'theorum/90_r_stem_sup_compiled_theorem.md',
                  'proof_lab/ghi_stem_sup_compiled.py',
                  'proof_lab/test_ghi_stem_sup_compiled.py',
                  'proof_lab/GHI_STEM_SUP_COMPILED_EXPECTED.sha256',
                  'theorum/91_ghi_stem_sup_compiled_theorem.md',
                  'proof_lab/hal_stem_sup_compiled.py',
                  'proof_lab/test_hal_stem_sup_compiled.py',
                  'proof_lab/HAL_STEM_SUP_COMPILED_EXPECTED.sha256',
                  'theorum/92_hal_stem_sup_compiled_theorem.md',
                  'proof_lab/napumsaka_sup_compiled.py',
                  'proof_lab/test_napumsaka_sup_compiled.py',
                  'proof_lab/NAPUMSAKA_SUP_COMPILED_EXPECTED.sha256',
                  'theorum/93_napumsaka_sup_compiled_theorem.md',
                  'proof_lab/sarvanama_sup_compiled.py',
                  'proof_lab/test_sarvanama_sup_compiled.py',
                  'proof_lab/SARVANAMA_SUP_COMPILED_EXPECTED.sha256',
                  'theorum/94_sarvanama_sup_compiled_theorem.md',
                  'proof_lab/lan_parasmaipada_compiled.py',
                  'proof_lab/test_lan_parasmaipada_compiled.py',
                  'proof_lab/LAN_PARASMAIPADA_COMPILED_EXPECTED.sha256',
                  'theorum/95_lan_parasmaipada_compiled_theorem.md',
                  'research/panini_grammar/vikarana_lat/LEXICAL_ENTRIES.json',
                  'research/panini_grammar/non_thematic_lat/LEXICAL_ENTRIES.json',
                  'research/panini_grammar/vikarana_lat/REFERENCE_CASES.json',
                  'research/panini_grammar/non_thematic_lat/REFERENCE_CASES.json',
              }) or '.github/workflows/repository-checks.yml' in changed,
          }
          scopes = {name: full or selected for name, selected in scopes.items()}
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              for name, selected in scopes.items():
                  output.write(f'{name}={str(selected).lower()}\n')
              output.write(f'node={str(any(scopes[k] for k in ("engine", "r3", "r4", "ss1"))).lower()}\n')
          selected = ', '.join(name for name, enabled in scopes.items() if enabled) or 'none'
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              summary.write('Navigation and public-release text: always checked.\n\n')
              summary.write(f'Additional existing contracts: {selected}.\n')
          print(f'Additional existing contracts: {selected}')
          PY
      - name: Check mathematics navigation
        run: python -m unittest proof_lab.test_mathematics_index -v
      - name: Check public-release text and audit regressions
        run: |
          python -m unittest scripts.test_public_release_audit -v
          python scripts/public_release_audit.py
      - uses: actions/setup-node@v4
        if: steps.scope.outputs.node == 'true'
        with:
          node-version-file: '.node-version'
      - name: Check canonical operator engine
        if: steps.scope.outputs.engine == 'true'
        run: node operator_foundation/verify_all.cjs --check
      - name: Check MR-04 through MR-07 memory contracts
        if: steps.scope.outputs.memory == 'true'
        run: |
          python -m unittest -v \
            proof_lab.test_morphic_memory \
            proof_lab.test_guarded_lopa \
            proof_lab.test_holonomy_scaling \
            proof_lab.test_memory_certificate
          python -m proof_lab.morphic_recognition.certify_memory --check-archive
      - name: Check R3 structure report
        if: steps.scope.outputs.r3 == 'true'
        run: |
          node research/structure_report/verify.cjs --check
          node research/structure_report/mutate.cjs
      - name: Check R4 declared-pairing repair
        if: steps.scope.outputs.r4 == 'true'
        run: |
          node research/structure_report/r4/verify.cjs --check
          node research/structure_report/r4/mutate.cjs
      - name: Check SS1 sectoral signals
        if: steps.scope.outputs.ss1 == 'true'
        run: node research/sectoral_signal/verify.cjs --check
      - name: Check SP1 cycle-memory examples and source pins
        if: steps.scope.outputs.sp1 == 'true'
        run: python research/spanda_recognition/check_examples.py
      - name: Check PG1 Sanskrit text inventory and source pins
        if: steps.scope.outputs.pg1 == 'true'
        run: python research/panini_grammar/check_sources.py
      - name: Check Theorem 78-95 quoted-source certificates, ledger and pins
        if: steps.scope.outputs.shaiva == 'true'
        run: |
          python -B -m unittest proof_lab.test_shaiva_sources_nativized proof_lab.test_shaiva_sources_varga_crystal proof_lab.test_paninian_instruction_format proof_lab.test_paninian_samjna_sound_layer proof_lab.test_paninian_it_samjna_compiled proof_lab.test_paniniya_siksha_sources proof_lab.test_vedanga_sources_quoted proof_lab.test_nirukta_nama_akhyatajani proof_lab.test_nirukta_dhatupatha_nama proof_lab.test_tripadi_nishtha_compiled proof_lab.test_ap_stem_sup_compiled proof_lab.test_ngi_stem_sup_compiled proof_lab.test_r_stem_sup_compiled proof_lab.test_ghi_stem_sup_compiled proof_lab.test_hal_stem_sup_compiled proof_lab.test_napumsaka_sup_compiled proof_lab.test_sarvanama_sup_compiled proof_lab.test_lan_parasmaipada_compiled proof_lab.test_astadhyayi_ledger -v
          python -B -m proof_lab.shaiva_sources_nativized --output /tmp/shaiva_actual.json
          python -B -m proof_lab.shaiva_sources_varga_crystal --output /tmp/shaiva_vc_actual.json
          python -B -m proof_lab.paninian_instruction_format --output /tmp/pif_actual.json
          python -B -m proof_lab.paninian_samjna_sound_layer --output /tmp/pssl_actual.json
          python -B -m proof_lab.paninian_it_samjna_compiled --output /tmp/pisc_actual.json
          python -B -m proof_lab.paniniya_siksha_sources --output /tmp/pss_actual.json
          python -B -m proof_lab.vedanga_sources_quoted --output /tmp/vsq_actual.json
          python -B -m proof_lab.nirukta_nama_akhyatajani --output /tmp/nna_actual.json
          python -B -m proof_lab.nirukta_dhatupatha_nama --output /tmp/ndn_actual.json
          python -B -m proof_lab.tripadi_nishtha_compiled --output /tmp/tnc_actual.json
          python -B -m proof_lab.ap_stem_sup_compiled --output /tmp/ap_actual.json
          python -B -m proof_lab.ngi_stem_sup_compiled --output /tmp/ngi_actual.json
          python -B -m proof_lab.r_stem_sup_compiled --output /tmp/rs_actual.json
          python -B -m proof_lab.ghi_stem_sup_compiled --output /tmp/ghi_actual.json
          python -B -m proof_lab.hal_stem_sup_compiled --output /tmp/hal_actual.json
          python -B -m proof_lab.napumsaka_sup_compiled --output /tmp/napumsaka_sup_compiled_actual.json
          python -B -m proof_lab.sarvanama_sup_compiled --output /tmp/sarvanama_sup_compiled_actual.json
          python -B -m proof_lab.lan_parasmaipada_compiled --output /tmp/lan_parasmaipada_compiled_actual.json
          python - <<'PY'
          import hashlib
          from pathlib import Path
          for actual_path, pin in (('/tmp/shaiva_actual.json', 'proof_lab/SHAIVA_SOURCES_NATIVIZED_EXPECTED.sha256'),
                                   ('/tmp/shaiva_vc_actual.json', 'proof_lab/SHAIVA_SOURCES_VARGA_CRYSTAL_EXPECTED.sha256'),
                                   ('/tmp/pif_actual.json', 'proof_lab/PANINIAN_INSTRUCTION_FORMAT_EXPECTED.sha256'),
                                   ('/tmp/pssl_actual.json', 'proof_lab/PANINIAN_SAMJNA_SOUND_LAYER_EXPECTED.sha256'),
                                   ('/tmp/pisc_actual.json', 'proof_lab/PANINIAN_IT_SAMJNA_COMPILED_EXPECTED.sha256'),
                                   ('/tmp/pss_actual.json', 'proof_lab/PANINIYA_SIKSHA_SOURCES_EXPECTED.sha256'),
                                   ('/tmp/vsq_actual.json', 'proof_lab/VEDANGA_SOURCES_QUOTED_EXPECTED.sha256'),
                                   ('/tmp/nna_actual.json', 'proof_lab/NIRUKTA_NAMA_AKHYATAJANI_EXPECTED.sha256'),
                                   ('/tmp/ndn_actual.json', 'proof_lab/NIRUKTA_DHATUPATHA_NAMA_EXPECTED.sha256'),
                                   ('/tmp/tnc_actual.json', 'proof_lab/TRIPADI_NISHTHA_COMPILED_EXPECTED.sha256'),
                                   ('/tmp/ap_actual.json', 'proof_lab/AP_STEM_SUP_COMPILED_EXPECTED.sha256'),
                                   ('/tmp/ngi_actual.json', 'proof_lab/NGI_STEM_SUP_COMPILED_EXPECTED.sha256'),
                                   ('/tmp/rs_actual.json', 'proof_lab/R_STEM_SUP_COMPILED_EXPECTED.sha256'),
                                   ('/tmp/ghi_actual.json', 'proof_lab/GHI_STEM_SUP_COMPILED_EXPECTED.sha256'),
                                   ('/tmp/hal_actual.json', 'proof_lab/HAL_STEM_SUP_COMPILED_EXPECTED.sha256'),
                                   ('/tmp/napumsaka_sup_compiled_actual.json', 'proof_lab/NAPUMSAKA_SUP_COMPILED_EXPECTED.sha256'),
                                   ('/tmp/sarvanama_sup_compiled_actual.json', 'proof_lab/SARVANAMA_SUP_COMPILED_EXPECTED.sha256'),
                                   ('/tmp/lan_parasmaipada_compiled_actual.json', 'proof_lab/LAN_PARASMAIPADA_COMPILED_EXPECTED.sha256')):
              actual = hashlib.sha256(Path(actual_path).read_bytes()).hexdigest()
              expected = Path(pin).read_text(encoding='utf-8').strip()
              assert actual == expected, (pin, actual, expected)
              print('PASS_HASH', pin, actual)
          PY
