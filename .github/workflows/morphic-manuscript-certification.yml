name: Morphic Manuscript Certification

on:
  push:
    branches:
      - agent/morphic-path-recognition-theorems
    paths:
      - 'theorum/morphic_algebra/**'
      - 'theorum/morphic_calculus/**'
      - 'scripts/materialize_morphic_manuscripts.py'
      - 'scripts/morphic_cert_builder_chunks/**'
      - '.github/workflows/morphic-manuscript-certification.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Materialize exact sources and verified publication LaTeX
        run: python scripts/materialize_morphic_manuscripts.py prepare

      - name: Install LaTeX runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y latexmk texlive-latex-extra texlive-science texlive-pictures lmodern

      - name: Compile Morphic Algebra
        run: |
          cd theorum/morphic_algebra
          latexmk -pdf -interaction=nonstopmode -halt-on-error main.tex

      - name: Compile Morphic Calculus
        run: |
          cd theorum/morphic_calculus
          latexmk -pdf -interaction=nonstopmode -halt-on-error main.tex

      - name: Finalize RNKE certification records
        run: python scripts/materialize_morphic_manuscripts.py finalize

      - name: Verify all certification gates
        run: python scripts/materialize_morphic_manuscripts.py verify

      - name: Upload compiled manuscripts and certificates
        uses: actions/upload-artifact@v4
        with:
          name: morphic-manuscripts-rnke-certification
          path: |
            theorum/morphic_algebra/main.pdf
            theorum/morphic_algebra/RNKE_CERTIFICATE.json
            theorum/morphic_algebra/CERTIFICATION_SUMMARY.md
            theorum/morphic_calculus/main.pdf
            theorum/morphic_calculus/RNKE_CERTIFICATE.json
            theorum/morphic_calculus/CERTIFICATION_SUMMARY.md

      - name: Commit exact sources, verified main.tex, and certificates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            theorum/morphic_algebra/source_original.tex \
            theorum/morphic_algebra/main.tex \
            theorum/morphic_algebra/PREPARE_MANIFEST.json \
            theorum/morphic_algebra/RNKE_CERTIFICATE.json \
            theorum/morphic_algebra/CERTIFICATION_SUMMARY.md \
            theorum/morphic_algebra/CERTIFICATION_STATUS.md \
            theorum/morphic_calculus/source_original.tex \
            theorum/morphic_calculus/main.tex \
            theorum/morphic_calculus/PREPARE_MANIFEST.json \
            theorum/morphic_calculus/RNKE_CERTIFICATE.json \
            theorum/morphic_calculus/CERTIFICATION_SUMMARY.md \
            theorum/morphic_calculus/CERTIFICATION_STATUS.md
          if git diff --cached --quiet; then
            echo "No certification material changed."
            exit 0
          fi
          git commit -m "Materialize verified Morphic manuscripts [skip ci]"
          git push
